name: 💡 Feature Request
description: Suggest a new feature or improvement for Russia Reworked
title: "[FEATURE] "
labels: ["Feature", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Russia Reworked? We'd love to hear it! Please provide as much detail as possible.

  - type: checkboxes
    id: search-existing
    attributes:
      label: Have you checked for similar suggestions?
      description: Please search existing issues and discussions before suggesting
      options:
        - label: I have searched for similar feature requests
          required: true

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: What type of feature/improvement is this? If multiple apply, select the most relevant
      options:
        - Focus Tree Content
        - National Spirits
        - Events & Decisions
        - Military/Equipment
        - Economic/Industrial
        - Political System
        - Localization/Text
        - UI/Interface
        - Historical Accuracy
        - Balance/Gameplay
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Describe your suggested feature in detail
      placeholder: "What would this feature do? How would it work?"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed?
      description: What problem does this solve or what improvement does it bring?
      placeholder: "Explain why this feature would be valuable for the mod"
    validations:
      required: false

  - type: dropdown
    id: affected-countries
    attributes:
      label: Which countries would this affect?
      description: Select the primary countries this feature would impact
      multiple: true
      options:
        - Russia
        - Ukraine
        - Russian States
        - Other countries
        - Global/All countries

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Implementation Ideas
      description: Do you have any ideas on how this could be implemented in the game?
      placeholder: |
        - Focus tree branches
        - Event chains
        - Decisions
        - National spirits
        - Other
        - I don't have specific ideas, just a general concept
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important do you think this feature is?
      options:
        - Low (nice to have)
        - Medium (would improve gameplay)
        - High (addresses significant issue)
        - Critical (essential for mod experience)
      default: 1
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Any additional information, mockups, references, or context?
        - Historical sources
        - Similar implementations in other mods
        - Screenshots or concept art
      placeholder: "You can attach files by dragging them into this text area"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/YummYume/Russia-2.0/blob/stable/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
