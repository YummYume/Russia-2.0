name: 🐛 Bug Report
description: Report a bug or issue with the Russia Reworked mod
title: "[BUG] "
labels: ["Bug", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us fix the issue quickly.

  - type: checkboxes
    id: search-existing
    attributes:
      label: Have you searched for existing issues?
      description: Please search existing issues before creating a new one
      options:
        - label: I have searched for similar issues
          required: true

  - type: checkboxes
    id: no-conflict
    attributes:
      label: Did you get a warning during startup about a mod conflict?
      description: Ensure you have no conflicting mods enabled
      options:
        - label: I did not get a warning about a mod conflict
          required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: What version of Russia Reworked are you using?
      placeholder: "e.g., v2.1.3 or latest from Steam Workshop"
    validations:
      required: true

  - type: input
    id: hoi4-version
    attributes:
      label: Hearts of Iron IV Version
      description: What version of HOI4 are you running?
      placeholder: "e.g., 1.14.7 'Overlord'"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: "Describe what happened and what you expected to happen instead"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug (if applicable)?
      placeholder: |
        1. Start as [country/leader]
        2. Do [action]
        3. Navigate to [location]
        4. See error
    validations:
      required: true

  - type: dropdown
    id: game-stage
    attributes:
      label: When did this occur?
      description: At what stage of the game did the bug happen?
      options:
        - Game start/setup
        - Early game (1936-1939)
        - Pre-war buildup (1939-1941)
        - During war (1941+)
        - Post-war/late game
        - Not applicable
    validations:
      required: false

  - type: checkboxes
    id: other-mods
    attributes:
      label: Other Mods
      description: Are you using any other mods alongside Russia Reworked?
      options:
        - label: I'm using other mods (please specify in additional info)
        - label: I'm using Russia Reworked only
        - label: I tested this with Russia Reworked only and the bug persists

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: |
        Any other information that might help us debug this issue?
        - Screenshots/videos
        - Save files
        - Other mods being used
        - System specs (if performance related)
      placeholder: "You can attach files by dragging them into this text area"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/YummYume/Russia-2.0/blob/stable/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
