name: Check the source branch

on:
  pull_request:
    branches:
      - stable
    types: [opened, synchronize, reopened]

env:
  ALLOWED_BRANCHES: "next"

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          shopt -s extglob
          allowed="${ALLOWED_BRANCHES}"
          match=false
          for pat in ${allowed}; do
            if [[ "${HEAD_REF}" == ${pat} ]]; then match=true; break; fi
          done
          if [[ "${match}" != "true" ]]; then
            echo "Error: Pull requests to 'stable' must originate from an allowed branch."
            echo "Current source branch: ${HEAD_REF}"
            echo "Allowed source patterns: ${ALLOWED_BRANCHES}"
            exit 1
          fi
